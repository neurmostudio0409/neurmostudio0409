<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 28" width="1000" height="28" role="img" aria-label="section divider">
  <defs>
    <linearGradient id="line" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="0">
      <stop offset="0%"   stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="18%"  stop-color="#22d3ee" stop-opacity=".45"/>
      <stop offset="50%"  stop-color="#a78bfa" stop-opacity=".85"/>
      <stop offset="82%"  stop-color="#22d3ee" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="spark">
      <stop offset="0%"   stop-color="#e0fbff" stop-opacity="1"/>
      <stop offset="35%"  stop-color="#22d3ee" stop-opacity=".8"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spark2">
      <stop offset="0%"   stop-color="#fdf4ff" stop-opacity="1"/>
      <stop offset="35%"  stop-color="#a78bfa" stop-opacity=".8"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>

    <filter id="dglow" x="-200%" y="-400%" width="500%" height="900%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>

    <style>
      .spin  { transform-origin: 500px 14px; animation: spin 8s linear infinite; }
      .beat  { transform-origin: 500px 14px; animation: beat 3s ease-in-out infinite; }
      .fade  { animation: fade 3s ease-in-out infinite; }
      .fade2 { animation: fade 3s ease-in-out infinite; animation-delay: -1.5s; }
      @keyframes spin { to { transform: rotate(360deg) } }
      @keyframes beat { 0%,100% { transform: scale(1) } 50% { transform: scale(1.35) } }
      @keyframes fade { 0%,100% { opacity:.35 } 50% { opacity:1 } }
    </style>
  </defs>

  <line x1="0" y1="14" x2="1000" y2="14" stroke="url(#line)" stroke-width="1.6"/>

  <!-- travelling sparks -->
  <circle r="9" cy="14" fill="url(#spark)" filter="url(#dglow)">
    <animate attributeName="cx" values="60;940" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.88;1" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  <circle r="7" cy="14" fill="url(#spark2)" filter="url(#dglow)">
    <animate attributeName="cx" values="940;60" dur="4.5s" begin="-2.25s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.88;1" dur="4.5s" begin="-2.25s" repeatCount="indefinite"/>
  </circle>

  <!-- centre mark -->
  <g class="fade"><line x1="452" y1="14" x2="476" y2="14" stroke="#22d3ee" stroke-width="1.6" stroke-linecap="round"/></g>
  <g class="fade2"><line x1="524" y1="14" x2="548" y2="14" stroke="#22d3ee" stroke-width="1.6" stroke-linecap="round"/></g>
  <g class="beat">
    <g class="spin">
      <rect x="493" y="7" width="14" height="14" rx="2" fill="none" stroke="#a78bfa" stroke-width="1.6"/>
    </g>
  </g>
  <circle cx="500" cy="14" r="2.4" fill="#e0fbff" class="fade"/>
</svg>
